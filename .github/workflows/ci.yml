name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: docker build -t reliable-agent-runtime-sandbox:phase5 -f docker/Dockerfile.sandbox .
      - run: python -m pytest -q
      - run: python -m evaluator.cli validate --tasks evaluation/tasks/tasks.json
