[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reliable-agent-runtime"
version = "0.0.0"
description = "A lightweight, reliable single-agent runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = [
  "app",
  "runtime",
  "tools",
  "llm",
  "persistence",
  "policies",
  "verifiers",
  "evaluator",
]

